            C_FLAGS: --diag_suppress=1 --diag_suppress=1295 --diag_suppress=870
            c99-mode: true
            gnu-extensions: true
            one-elf-section-per-function: true
            optimization: level-1
            warnings: all-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
        scatterFilePath: ""
        storageLayout:
